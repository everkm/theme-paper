config:
  site:
    name: Paper Theme
    description: A minimal, responsive blog theme migrated from Astro Paper.
    author: Everkm
    lang: en
    timezone: UTC

  home: /home.md
  about: /about.md

  posts:
    per_page: 4
    per_index: 4
    featured_tag: featured

  features:
    light_and_dark_mode: true
    show_archives: true
    show_back_button: true
    search: pagefind
    view_transitions: true
    edit_post:
      enabled: false

  socials:
    - name: github
      url: https://github.com/everkm/theme-paper
    - name: everkm
      url: https://everkm.com

  copyright:
    text: everkm
    link: https://everkm.com

folders:
  "/posts/":
    url_id_suffix: false
